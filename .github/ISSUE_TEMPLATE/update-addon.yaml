name: Update an addon
description: Publish a new version of a widget, theme, layout or config you submitted before.
title: "[update-addon]: "
labels: ["addon-update"]
body:
  - type: upload
    id: files
    attributes:
      label: Files
      description: >-
        A ZIP file with the new version, made the same way as your first one. Keep the `id` in `manifest.json` and
        raise `version` above the last one.
    validations:
      required: true
      accept: ".zip"
  - type: textarea
    id: changes
    attributes:
      label: What changed
      description: >-
        What is new or fixed in this version. It is added to the change log in your addon's README. Markdown is
        supported. **Don't use HTML tags or images here**, YASB leaves them out, upload new screenshots in Screenshot
        and Images below.
    validations:
      required: true
  - type: upload
    id: screenshot
    attributes:
      label: Screenshot
      description: >-
        A new picture of your addon, shown on its card and page in YASB's Addons window: a screenshot of it in use, or a
        logo you made for it. Leave it empty to keep the current one. Leave it empty for a theme too, we make a new
        picture of its colours. PNG or JPG, at least 800x800. A wider or taller image is cropped to the square in its
        middle.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg"
  - type: upload
    id: images
    attributes:
      label: Images
      description: New screenshots, at most 5, they replace all the current ones. Leave it empty to keep them.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg"
