name: Submit an addon
description: Add a new widget, theme, layout or config to the addon library.
title: "[submit-addon]: "
labels: ["addon"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Widget
        - Theme
        - Layout
        - Config
    validations:
      required: true
  - type: upload
    id: files
    attributes:
      label: Files
      description: >-
        A ZIP file with your addon and its `manifest.json`.
        [How to make it](https://github.com/amnweb/yasb-addons/blob/main/CONTRIBUTING.md)
    validations:
      required: true
      accept: ".zip"
  - type: textarea
    id: about
    attributes:
      label: About
      description: >-
        What your addon is, what it needs, and what people have to change to use it. This text becomes the README of
        your addon. Markdown is supported. **Don't use HTML tags or images here**, YASB leaves them out, upload your
        screenshots in Screenshot and Images below.
      placeholder: |
        A clock with the date in its popup. Click it to open the calendar.

        Needs the Segoe Fluent Icons font.

        Change your city in Clock.qml, line 12.
    validations:
      required: true
  - type: upload
    id: screenshot
    attributes:
      label: Screenshot
      description: >-
        Your addon's picture, shown on its card and page in YASB's Addons window: a screenshot of it in use, or a logo
        you made for it. **Required for a widget, layout or config.** Leave it empty for a theme, we make a picture of
        its colours. PNG or JPG, at least 800x800. A wider or taller image is cropped to the square in its middle.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg"
  - type: upload
    id: images
    attributes:
      label: Images
      description: More screenshots of your addon in use, at most 5. Optional.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg"
  - type: markdown
    attributes:
      value: |
        `manifest.json` looks like this:

        ```json
        {
          "id": "yourlogin.clock",
          "title": "Clock",
          "description": "A clock with the date in its popup",
          "version": 1,
          "released": "2026-11-22"
        }
        ```

        To publish a new version later, use the **Update an addon** form.
